<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>Profiling</title>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="pagecontainer">
<div class="button-panel">
    <div class="contents">
        <a id="exec-btn" class="button" href="javascript:void(0)" onclick="onExec()"><div class="icon refresh"></div>Execute</a>
        <select id="count-val">
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>5</option>
            <option>10</option>
            <option selected="selected">100</option>
            <option>200</option>
            <option>300</option>
            <option>500</option>
            <option>1000</option>
        </select>
        <div id="warning-msg" class="icon warning" title="Closing or refreshing this page interrupts the profiling loop"></div>
    </div>
</div>
<div class="panel">
<div class="contents">
<table class="type3">
    <tr>
        <th><div class="icon help" title="A simple axell shell command like 'get rsp'"></div>Command</th>
        <td><input id="cmd-val" type="text" value="get rsp" autofocus="autofocus" onkeypress="javascript: return keyProcessor(event)"/></td>
    </tr>
	<tr>
    	<th><div class="icon help" title="Number of times the command is executed so far"></div>Executed:</th>
        <td><span id="loop-val"></span> <progress id="progress-bar"></progress></td>
	</tr>
	<tr>
    	<th><div class="icon help" title="Total time that it took to run the command so far."></div>Total Time:</th>
        <td id="tot-time-val"></td>
	</tr>
	<tr>
    	<th><div class="icon help" title="Acerage time for executing one command (while processing the loop it shows the current average time)."></div>Average Time:</th>
        <td id="avg-time-val"></td>
	</tr>
</table>
</div>
</div>
</div>
<script type="text/javascript" data-main="/js/main.js" src="/js/require.js"></script>
</body>
</html>
