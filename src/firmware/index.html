<!DOCTYPE html>
<html>
<head>
    <title>Firmware Update</title>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="pagecontainer">
  <form>
    <div class="panel">
      <div class="header">File Upload</div>
      <div class="contents">
        <p>You can upgrade the firmware of the controller if you have an image released from Axell Wireless. Please check our website (<a href="http://www.axellwireless.com">www.axellwireless.com</a>) or contact support for more information.</p>
        <label for="filepath">Firmware File:</label>
        <input id="filepath" type="file" name="firmware" size="100" />
        <br/>
      </div>
    </div>
    <div class="button-panel">
        <a class="button"><div class="icon upload"></div> Upload</a>
    </div>
  </form>
</div>
<script type="text/javascript" data-main="/js/main.js" src="/js/require.js"></script>
</body>
</html>
