<!DOCTYPE html>
<html>
<head>
    <title>User Quotas Management</title>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="pagecontainer">
  <div class="panel">
    <div class="header">Device Quotas Per Operator</div>

    <div class="contents">
        <div id="filter"><b> Filter by Devices:</b>
            <div><input type="radio" name="devices_type" value="All" /> All</div>
            <div><input type="radio" name="devices_type" value="MTDI"/> MTDI</div>
            <!-- div><input type="radio" name="devices_type" value="MSDH"/> MSDH</div -->
            <div><input type="radio" name="devices_type" value="RRU"/> RRU</div>
        </div>
        <div id="legend" class="legend"></div>
        <div id="freq_range_contents"></div>
    </div>
    <div id="devices_contents"></div>
    <div class="wizard-bottom-panel">
        <div class="icon warning" title="Updating allocated quotas may affect current active profile. Please deactivate all routing profile before updating this page."></div>
        <a id="save-button" class="button"> Save</a>
        <a class="button" id="cancel">Cancel</a>
    </div>

</div>
    
    
<script type="text/javascript" data-main="/js/main.js" src="/js/require.js"></script>
</body>
</html>
