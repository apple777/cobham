<!DOCTYPE html>
<html>
<head>
    <title>Software Update Manager</title>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div style="display:none" id="popupfail">
Some boxes failed during upgrade, do you want to continue?
</div>
<div style="display:none" id="popupapply">
</div>
<div class="inventory_pagecontainer">
    <div id="control_buttons" class="button-panel" style="height: 30px;">
    </div>
	<div class="panel collapsible" style="width: 1400px">
        <div class="header"><span id="log-count"></span></div>
        <div class="contents">
			<table id="inventory-table" >
				<caption>Software Update</caption>
                <thead>
                    <tr class="inventory_table_head">
                        <td                       id="Activate"><input type="checkbox" id="checkall" checked/> Activate</td>
                        <td title="click to sort" id="Node Type">Node Type</td>
                        <td title="click to sort" id="ID">ID</td>
                        <td title="click to sort" id="Comm">Com.</td>
                        <td title="click to sort" id="Tag">Tag</td>
                        <td title="click to sort" id="Location">Location</td>
                        <td title="click to sort" id="System">System</td>
                        <td title="click to sort" id="Common">Common</td>
                        <td title="click to sort" id="Target">Target</td>
                        <td title="click to sort" id="IP">IP address</td>
                        <td title="click to sort" id="Status">Status</td>
                        <!--td                       id="Confirm"></td-->
                    </tr>
                </thead>
                <tbody>
                </tbody>
			</table>
		</div>
	</div>
</div>
<script type="text/javascript" data-main="/js/main.js" src="/js/require.js"></script>
</body>
</html>
