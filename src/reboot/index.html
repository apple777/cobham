<!DOCTYPE html>
<html>
<head>
    <title>Reboot</title>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="pagecontainer">
  <div class="warning-panel"><div class="icon warning"></div> <em>WARNING!</em><br />
    This feature is provided for emergency purposes only. You don't need to reboot the controller for changes to take effect. All settings are applied without requiring to reboot the controller.</div>
  <div class="button-panel">
      <a id="reboot-button" class="button" title="Reboot the controller"><div class="icon reboot"></div> Reboot</a>
      <input id="forcerebootCbxc" type="checkbox" title="Force reboot the controller" />
      <label for="forcerebootCbxc">Force Reboot</label>
      <div class="icon warning" title="Trying force reboot may damage the system and settings. Please use force reboot as last option."></div>
  </div>
</div>
<div id="reboot-in-progress-dialog" style="display: none">
    Rebooting the controller...
    <br/>
    <div id="reboot-progress-bar"></div>
</div>
<script type="text/javascript" data-main="/js/main.js" src="/js/require.js"></script>
</body>
</html>
