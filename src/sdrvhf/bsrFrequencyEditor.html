<div style="display: none">
    <div id="bsr-frequency-editor-contents">
        <div id="bsr-frequency-editor">
            <div class="edit-and-label" style="left:160px;top: 5px">
                <label for="bsr-library-select">Library</label>
                <select id="bsr-library-select"></select>
            </div>
            <div class="edit-and-label" style="left:160px;top: 63px">
                <label for="bsr-edit-span">Span [Hz]</label>
                <select id="bsr-edit-span" />
                <!--<div id="bsr-range-hint-span" class="bsr-range-hint"></div> -->
            </div>
            <div class="edit-and-label" style="left:0px;top: 167px">
                <label for="bsr-edit-start">Start [MHz]</label>
                <input type="number" step="any" id="bsr-edit-start" class="validation-range" />
                <div id="bsr-range-hint-start" class="bsr-range-hint"></div>
            </div>
            <div class="edit-and-label" style="left:160px;top: 167px">
                <label for="bsr-edit-center">Center [MHz]</label>
                <input type="number" step="any" id="bsr-edit-center" class="validation-range" />
                <div id="bsr-range-hint-center" class="bsr-range-hint"></div>
            </div>
            <div class="edit-and-label" style="left:319px;top: 167px">
                <label for="bsr-edit-stop">Stop [MHz]</label>
                <input type="number" step="any" id="bsr-edit-stop" class="validation-range" />
                <div id="bsr-range-hint-stop" class="bsr-range-hint"></div>
            </div>
        </div>
    </div>
</div>
