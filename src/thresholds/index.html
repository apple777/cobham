<!DOCTYPE html>
<html>
<head>
    <title>Alarms Configuration</title>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="pagecontainer">
         <div class="button-panel">
            <a id="advanced-button" class="button">Advanced</a>
            <a id="apply-button" class="button">Apply</a>
        </div>
        <div class="panel">
            <div class="contents">
                <table id="sliders-table" class="type2">
                    <caption style="line-hight:20ps;font-size:15px">Thresholds Settings</caption>
                    <thead>
                        <tr class="sliders_table_head">
                            <td style="width:250px;">Name</td>
                            <td style="width:75px;">Min Val</td>
                            <td></td>
                            <td style="width:75px;">Max Val</td>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="panel">
            <div class="contents">
                <table id="severity-table" class="type2">
                    <caption style="line-hight:20ps;font-size:15px">Alarms Severity Settings</caption>
                    <thead>
                        <tr class="severity_table_head">
                            <td style="width:100px;" id="Attribute">Attribute</td>
                            <td style="width:100px;" id="HwEnum">HW Enumaration</td>
                            <td id="Description">Description</td>
                            <td style="width:100px;" id="Severity">Severity</td>
                            <td style="width:100px;" id="DryContact">Dry Contact</td>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="text/javascript" data-main="/js/main.js" src="/js/require.js"></script>
</body>
</html>
